dataset_args:
  name: spectrabase
  datadir: /home/nmrbox/0015/jdonner/spec2mol-chefnmr/data
  atom_decoder:
  - C
  - H
  - O
  - 'N'
  remove_h: false
  remove_stereo: true
  input_generator: H1C13NMRSpectrum
  input_generator_addn_args:
    h1nmr:
      data_dim: 10000
      input_dim: 10000
      transform: identity
    c13nmr:
      data_dim: 80
      input_dim: 80
      transform: identity
  known_atoms: true
  timeout_seconds: 0
  split_indices_suffix: ''
  max_n_atoms: 59
  sigma_data: 2.02
  multitask_args:
    p_drop_h1nmr: 0.1
    p_drop_c13nmr: 0.1
    p_drop_both: 0.1
    drop_transform: zero
  augmentation_args:
    max_n_h1spectra: 11
    max_n_c13spectra: 11
    max_n_conformers: 3
  batch_size: 32
  num_workers: 0
  pin_memory: true
  find_unused_parameters: false
  train_args:
    use_subset: false
    train_samples: 100000
    train_seed: 42
  test_args:
    test_samples: 100000
    test_batch_size: 128
    test_seed: 42
    test_index: null
    test_p_drop_h1nmr: 0.0
    test_p_drop_c13nmr: 0.0
  shuffle: true
  selection_manifest_dir: /home/nmrbox/0015/jdonner/spec2mol-chefnmr/selections/strict_clean_conformers_v1
  spectral_variant_mode: reference
  spectral_variant_count: 11
  spectral_variant_seed: 42
general:
  experiment_name: spec2mol-reference-seed42
  seed: 42
  wandb: disabled
  mode: train
  ckpt_abs_path: null
  save_checkpoint: true
  save_top_n_ckpts: 2
neural_network_args:
  use_ema: true
  ema_decay: 0.999
score_model_args:
  model_name: DiffusionModuleTransformer
  DiffusionModuleTransformer:
    in_atom_feature_size: null
    out_atom_feature_size: 3
    condition: null
    in_condition_size: null
    drop_transform: null
    max_n_atoms: null
    n_blocks: 12
    n_heads: 8
    hidden_size: 768
    mlp_ratio: 4.0
    embedder_args:
      hidden_dim: 256
      dropout: 0.1
      pooling: attn
      tokenizer_args:
        h_tokenizer: conv
        c_tokenizer: embed
        h_pool_sizes:
        - 8
        - 12
        h_kernel_sizes:
        - 5
        - 9
        h_out_channels:
        - 64
        - 128
        c_pool_sizes:
        - 8
        - 12
        c_kernel_sizes:
        - 5
        - 9
        c_out_channels:
        - 64
        - 128
        h_patch_size: 192
        h_patch_stride: 96
        c_patch_size: 192
        c_patch_stride: 96
        h_mask_token: true
        c_mask_token: true
      transformer_args:
        pos_enc: learnable
        type_enc: true
        depth: 4
        heads: 8
        dim_head: null
        mlp_ratio: 4
trainer:
  accelerator: gpu
  devices: 1
  num_nodes: 1
  max_epochs: 11
  check_val_every_n_epoch: 1
  log_every_n_steps: 50
  reload_dataloaders_every_n_epochs: 0
  precision: bf16-mixed
  gradient_clip_val: null
  accumulate_grad_batches: 1
  num_sanity_val_steps: 2
  max_steps: 32736
training_args:
  diffusion_multiplicity: 1
  optimizer: adam
  adam:
    adam_beta_1: 0.9
    adam_beta_2: 0.95
    adam_eps: 1.0e-08
  base_lr: 0.0001
validation_args:
  diffusion_multiplicity: 1
  sample_every_n_val_epoch: 50
  diffusion_samples: 1
  num_sampling_steps: 50
  visualize_samples: 10
  visualize_chains: 2
test_args:
  num_sampling_steps: 50
  diffusion_samples: 1
  visualize_samples: 10
  visualize_chains: 2
visualization_args:
  n_chain_frames: 50
diffusion_process_args:
  train_sigma_distribution_type: af3
  train_sigma_args:
    edm_P_mean: -1.2
    edm_P_std: 1.3
  sample_sigma_schedule_type: edm
  sample_gamma_schedule_type: edm
  sigma_min: 0.001
  sigma_max: 80.0
  gamma_min: 1.0
  noise_scale: 1.0
  step_scale: 1.0
  guidance_scale: 2.0
  synchronize_sigmas: false
  coordinate_transformation_when_training: centering_rotation_translation
  edm_args:
    sigma_data: null
    rho: 7
    use_heun_solver: true
    gamma_0: 0.8
diffusion_loss_args:
  add_smooth_lddt_loss: true
  lddt_loss_threshold:
  - 0.5
  - 1.0
  - 2.0
  - 4.0
